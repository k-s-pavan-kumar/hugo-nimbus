name = "Nimbus"
license = "MIT"
licenselink = "https://github.com/k-s-pavan-kumar/hugo-nimbus/blob/main/LICENSE"
description = "A Tailwind CSS theme for DevOps knowledge hubs: blog posts, sidebar-navigation docs, Architecture Decision Records, native OpenAPI spec rendering, dark mode, client-side search, and terminal/diff/callout shortcodes for technical writing."
homepage = "https://github.com/k-s-pavan-kumar/hugo-nimbus"
tags = ["devops", "documentation", "blog", "openapi", "api-docs", "adr", "dark-mode", "tailwind", "search", "responsive"]
features = ["dark-mode", "search", "syntax-highlighting", "mermaid-diagrams", "sidebar-docs-nav", "openapi-rendering", "adr-tracking", "diff-rendering", "table-of-contents", "rss", "sitemap", "seo"]
min_version = "0.146.0"

[author]
  name = "Nimbus contributors"
  homepage = "https://github.com/k-s-pavan-kumar/hugo-nimbus"

[original]
  name = "Nimbus"
  homepage = "https://github.com/k-s-pavan-kumar/hugo-nimbus"
