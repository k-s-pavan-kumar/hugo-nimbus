baseURL = 'https://example.com/'
languageCode = 'en-us'
title = 'Nimbus'
theme = "nimbus"
# Uncomment once this site is a git repository, to show real git-history
# "last updated" dates and authors instead of the file-based fallback:
# enableGitInfo = true

[markup]
# Enable syntax highlighting

  [markup.highlight]
    style = "github"
    lineNos = true
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 2

# Enable Mermaid and other shortcodes
[markup.goldmark.renderer]
  unsafe = true

# Taxonomies for tagging and categorization
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  technology = "technologies"

# Menu configuration
[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "docs"
  name = "Documentation"
  url = "/docs/"
  weight = 20

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/blog/"
  weight = 30

[[menu.main]]
  identifier = "adr"
  name = "ADRs"
  url = "/adr/"
  weight = 35

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

# Theme parameters
[params]
  description = "Your comprehensive DevsecOps knowledge hub with tutorials, best practices, and real-world examples"
  author = "Nimbus"
  
  # SEO and Social
  images = ["images/devops-og-image.png"]
  twitter_card = "summary_large_image"
  
  # Features
  search = true
  darkMode = true
  toc = true
  copyCodeButton = true
  mermaid = true

  # "Edit this page" links — base repo URL + branch; the page's file path is
  # appended automatically. Update this to your real repo before deploying.
  editURL = "https://github.com/your-org/hugo-theme-nimbus/edit/main/exampleSite/"

  # Docs version switcher (shown in the docs sidebar). The current version's
  # `url` should point at the live docs section; others can point anywhere,
  # including an external archived deployment.
  [[params.docsVersions]]
    name = "v2.0 (current)"
    url = "docs/"
    current = true
  [[params.docsVersions]]
    name = "v1.0 (archived)"
    url = "docs-v1/"
    current = false

  # Chroma syntax-highlighting stylesheet (assets/css/syntax-<style>.css)
  [params.highlight]
    style = "github"
  
  # Social links
  [params.social]
    twitter = "https://x.com/kspavankumar24"
    github = "https://github.com/k-s-pavan-kumar"
    linkedin = "https://www.linkedin.com/in/kspavankumar/"
    
  # Analytics (uncomment and configure as needed)
  # [params.analytics]
  #   google = "G-XXXXXXXXXX"
  #   plausible = "devops-knowledge.example.com"

# Output formats for search
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

