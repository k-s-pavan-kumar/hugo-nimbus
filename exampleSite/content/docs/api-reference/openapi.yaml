openapi: 3.0.3
info:
  title: Deploys API
  version: "1.0"
  description: Trigger and inspect deployments for a service.
servers:
  - url: https://api.example.com/v1
paths:
  /services/{serviceId}/deploys:
    get:
      summary: List recent deploys
      description: Returns the most recent deploys for a service, newest first.
      parameters:
        - name: serviceId
          in: path
          required: true
          description: The service identifier.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max number of results to return (default 20).
          schema:
            type: integer
      responses:
        "200":
          description: A list of deploys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deploy'
        "404":
          description: Service not found.
    post:
      summary: Trigger a new deploy
      description: Starts a new deploy of the given image to the service.
      parameters:
        - name: serviceId
          in: path
          required: true
          description: The service identifier.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        "202":
          description: Deploy accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        "400":
          description: Invalid request body.
  /services/{serviceId}/deploys/{deployId}:
    get:
      summary: Get deploy status
      parameters:
        - name: serviceId
          in: path
          required: true
          description: The service identifier.
          schema:
            type: string
        - name: deployId
          in: path
          required: true
          description: The deploy identifier.
          schema:
            type: string
      responses:
        "200":
          description: The deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
components:
  schemas:
    DeployRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: Container image, including tag.
        replicas:
          type: integer
          description: Desired replica count. Defaults to current value.
    Deploy:
      type: object
      properties:
        id:
          type: string
          description: Unique deploy identifier.
        status:
          type: string
          description: One of pending, running, succeeded, failed.
        image:
          type: string
          description: Container image that was deployed.
        startedAt:
          type: string
          description: ISO-8601 timestamp.
