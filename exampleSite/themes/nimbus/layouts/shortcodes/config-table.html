{{ $rows := .Inner | transform.Unmarshal }}

<table class="w-full text-sm border-collapse my-6">
  <thead>
    <tr class="border-b border-gray-200 dark:border-neutral-800 text-left text-gray-500 dark:text-gray-400">
      <th class="py-2 pr-4 font-medium">Name</th>
      <th class="py-2 pr-4 font-medium">Type</th>
      <th class="py-2 pr-4 font-medium">Default</th>
      <th class="py-2 font-medium">Description</th>
    </tr>
  </thead>
  <tbody>
    {{ range $rows }}
    <tr class="border-b border-gray-100 dark:border-neutral-900 align-top">
      <td class="py-2 pr-4 font-mono text-gray-900 dark:text-gray-100 whitespace-nowrap">
        {{ .name }}{{ if .required }}<span class="text-red-500" title="Required">*</span>{{ end }}
      </td>
      <td class="py-2 pr-4 font-mono text-primary-600 dark:text-primary-400 whitespace-nowrap">{{ .type }}</td>
      <td class="py-2 pr-4 font-mono text-gray-500 dark:text-gray-500 whitespace-nowrap">
        {{ if .default }}{{ .default }}{{ else }}<span class="italic text-gray-400 dark:text-gray-600">none</span>{{ end }}
      </td>
      <td class="py-2 text-gray-600 dark:text-gray-400">{{ .description }}</td>
    </tr>
    {{ end }}
  </tbody>
</table>
