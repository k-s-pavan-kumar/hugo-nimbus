{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">{{ .Title }}</h1>

  {{ if not .Date.IsZero }}
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}" class="block text-sm text-gray-500 dark:text-gray-500 mb-8">
    {{ .Date.Format "January 2, 2006" }}
  </time>
  {{ end }}

  <div class="prose prose-lg dark:prose-invert max-w-none">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
  <div class="mt-8 pt-6 border-t border-gray-100 dark:border-neutral-900">
    {{ partial "terms.html" (dict "taxonomy" "tags" "page" $) }}
  </div>
  {{ end }}

  {{ partial "page-git-meta.html" . }}
</div>
{{ end }}
